  </g>
  <!-- Stacked Wordmark: DESIGN / CUEBE -->
  <text x="44" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans Flex', 'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#111827" letter-spacing="1.8">DESIGN</text>
  <text x="43" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans Flex', 'Inter', sans-serif" font-size="18.5" font-weight="900" fill="#111827" letter-spacing="-0.5">CUEBE</text>
</svg>
