<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 42" fill="none" height="36">
  <!-- Isometric 3D Cube Icon -->
  <g stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(2, 2)">
    <!-- Outer hexagon -->
    <path d="M18 4 L33 12.5 L33 29.5 L18 38 L3 29.5 L3 12.5 Z" />
    <!-- Inner Y axes -->
    <path d="M18 4 L18 21" />
    <path d="M3 12.5 L18 21" />
    <path d="M33 12.5 L18 21" />
    <!-- Center core box for high-tech cuebe feel -->
    <path d="M18 21 L18 38" />
