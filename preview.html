<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarmad Gardezi - Cloud & Full Stack Engineer</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Main Theme Stylesheet -->
    <link rel="stylesheet" href="sarmadgardezi/assets/css/main.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #1c1917;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
    </style>
</head>

<body>

    <!-- Header Matching Reference (White ground, Centered Nav, Sign up & Log in Pill) -->
    <header class="site-header-custom" id="masthead">
        <div class="site-header-container">
            <div class="site-header-inner">
                <div class="header-left">
                    <a class="brand-link" href="#" rel="home" aria-label="Sarmad Gardezi">
                        <span class="brand-name-text">Sarmad Gardezi</span>
                    </a>
                </div>
                <nav class="header-nav header-desktop-nav" aria-label="Primary Navigation">
                    <ul class="header-nav-list">
                        <li class="header-nav-item is-active"><a class="header-nav-link" href="#">Home</a></li>
                        <li class="header-nav-item"><a class="header-nav-link" href="#about">About</a></li>
                        <li class="header-nav-item"><a class="header-nav-link" href="#projects">Projects</a></li>
                        <li class="header-nav-item"><a class="header-nav-link" href="#blog">Blog</a></li>
                        <li class="header-nav-item"><a class="header-nav-link" href="#contact">Contact</a></li>
                    </ul>
                </nav>
                <div class="header-right">
                    <div class="header-auth-actions">
                        <a class="header-auth-link" href="#">Sign up</a>
                        <a class="header-auth-btn" href="#">Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Creative White Hero Section Matching Reference Screenshot -->
    <section id="hero" class="hero-creative-section">
        <div class="hero-creative-container">

            <!-- Left Column: Creative Typography & Copy -->
            <div class="hero-creative-content">

                <h1 class="hero-creative-title">

                    <!-- Line 1: "Grow" + Capsule Arrow Badge -->
                    <span class="hero-title-line">
                        <span class="title-word">Grow</span>
                        <span class="badge-capsule-arrow" aria-hidden="true">
                            <span class="badge-circle-green"></span>
                            <span class="badge-body-blue">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
                                    stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </span>
                        </span>
                    </span>

                    <!-- Line 2: Circle Dot + Outline Capsule + "a team" -->
                    <span class="hero-title-line">
                        <span class="badge-circle-dot" aria-hidden="true">
                            <span class="inner-dot"></span>
                        </span>
                        <span class="badge-capsule-outline" aria-hidden="true">
                            <span class="inner-bar"></span>
                        </span>
                        <span class="title-word">a team</span>
                    </span>

                    <!-- Line 3: "together" + Duo Circles Badge -->
                    <span class="hero-title-line">
                        <span class="title-word">together</span>
                        <span class="badge-duo-circles" aria-hidden="true">
                            <span class="circle-yellow"></span>
                            <span class="circle-dark">
                                <span class="connecting-line"></span>
                            </span>
                        </span>
                    </span>

                </h1>

                <p class="hero-creative-desc">
                    UI UX designers create the user interface for an app, website, or other
                    <span class="hero-accent-green">interactive media</span>.
                    Their work includes collaborating with product ...
                </p>

                <div class="hero-creative-actions">
                    <a href="#contact" class="hero-btn-dark">
                        Get for free
                    </a>
                    <a href="#about" class="hero-btn-text">
                        How its Work
                    </a>
                </div>

            </div>

            <!-- Right Column: Subject Portrait with Floating Badges -->
            <div class="hero-creative-stage">

                <!-- Floating Sparkle Stars (Top-Right) -->
                <div class="hero-sparkle-stars" aria-hidden="true">
                    <svg class="star star-top" width="28" height="28" viewBox="0 0 24 24" fill="#fde047">
                        <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z" />
                    </svg>
                    <svg class="star star-mid" width="20" height="20" viewBox="0 0 24 24" fill="#facc15">
                        <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z" />
                    </svg>
                    <svg class="star star-bottom" width="14" height="14" viewBox="0 0 24 24" fill="#fef08a">
                        <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z" />
                    </svg>
                </div>

                <!-- Floating Dual Fan + Anchor + "Uishyed" Badge (Left Side) -->
                <div class="hero-float-uishyed" aria-hidden="true">
                    <div class="uishyed-fan-group">
                        <div class="fan-wings">
                            <span class="wing wing-blue"></span>
                            <span class="wing wing-sky"></span>
                        </div>
                        <div class="fan-anchor">
                            <span class="anchor-ring"></span>
                            <span class="anchor-stem"></span>
                            <span class="anchor-arrow-circle">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
                                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <polyline points="19 12 12 19 5 12"></polyline>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="uishyed-card">
                        <span class="uishyed-green-dot"></span>
                        <span class="uishyed-label">Uishyed</span>
                    </div>
                </div>

                <!-- Floating Globe Badge (Right Side) -->
                <div class="hero-float-globe" aria-hidden="true">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                        </path>
                    </svg>
                </div>

                <!-- Main Subject Portrait -->
                <div class="hero-portrait-wrap">
                    <img src="/wp-content/uploads/2026/10/sarmadgardezihero.png" alt="Sarmad Gardezi"
                        class="hero-portrait-img" loading="eager"
                        onerror="this.onerror=null; this.src='sarmadgardezi/assets/images/sarmad-hero.jpg';" />
                </div>

                <!-- Bottom Horizontal Baseline -->
                <div class="hero-stage-baseline" aria-hidden="true"></div>

                <!-- Floating Yellow Diagonal Arrow Button (Bottom-Right) -->
                <a href="#contact" class="hero-float-arrow" aria-label="Get Started">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="3.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </a>

            </div>

        </div>
    </section>

</body>

</html>
