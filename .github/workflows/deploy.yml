name: Deploy WordPress Theme

on:
  push:
    branches:
      - main
    paths:
      - "sarmadgardezi/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy theme
        run: |
          rsync -az --delete \
            ./sarmadgardezi/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/sarmadgardezi.com/wp-content/themes/sarmadgardezi/"

      - name: Verify deployment
        run: |
          ssh -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "ls -lah /var/www/sarmadgardezi.com/wp-content/themes/sarmadgardezi/"